<div class="app-layout">
  <app-header (toggleMobileDrawer)="isMobileDrawerOpen.set(true)"></app-header>

  <main class="main-body">
    <router-outlet></router-outlet>
  </main>

  <app-mobile-drawer
    [isOpen]="isMobileDrawerOpen()"
    (close)="isMobileDrawerOpen.set(false)">
  </app-mobile-drawer>

  <app-search-modal></app-search-modal>
</div>
